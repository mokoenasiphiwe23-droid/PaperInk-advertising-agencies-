name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project scaffold
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          test -d docs
          test -d src
          test -d tests
          echo "Project scaffold is valid."

      - name: Set up Node.js when package metadata exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and run JavaScript tests
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm test

      - name: Explain test status for scaffold-only repository
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json found; scaffold validation completed. Add package.json and npm test to enable JavaScript tests."
